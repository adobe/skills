name: Tessl Skill Eval

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Whether the last commit asks for evals, and whether they can run. The request is the
  # commit message; nobody has to approve it. A pull request from a fork gets no
  # TESSL_TOKEN on pull_request, so it can ask but not run.
  eval-requested:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.trigger.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check eval trigger
        id: trigger
        env:
          HAS_TOKEN: ${{ secrets.TESSL_TOKEN != '' }}
        run: |
          LAST_MSG=$(git log -1 --format=%s)
          echo "commit_message=$LAST_MSG"
          if [[ "$LAST_MSG" =~ ^eval: ]] && [ "$HAS_TOKEN" != true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Skill Eval"
              echo ""
              echo "Eval requested, but \`TESSL_TOKEN\` is not available to this run. Pull requests from forks get no secrets:"
              echo "ask a maintainer to run the evals from a branch in this repository."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Skill Eval::Evals were requested but can't run for a pull request from a fork"
          elif [[ "$LAST_MSG" =~ ^eval: ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Eval triggered by commit: $LAST_MSG"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Skill Eval"
              echo ""
              echo "Eval not requested — last commit message does not start with \`eval:\`."
              echo "To trigger evals, create a commit with a message like:"
              echo "\`\`\`"
              echo 'git commit --allow-empty -m "eval: test building-blocks changes"'
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Runs the evals. Its verdict is the `tessl-eval` job below, so this job stays green when
  # an eval fails: one red check per failure, not two.
  run-evals:
    needs: eval-requested
    if: needs.eval-requested.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      # failed, no-credits or passed; empty when there was nothing to evaluate
      outcome: ${{ steps.run-evals.outputs.outcome }}
      # failure when the script exited with an error, whatever it wrote before
      step: ${{ steps.run-evals.outcome }}
    # No environment: TESSL_TOKEN is a repository secret, so an approval step here never
    # kept a branch of this repository from using it. It only made every eval wait for a person.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Detect changed plugins
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # the plugins this pull request touches that have scenarios in evals/; all of
          # those if it changes something under plugins/ that belongs to no plugin, or the
          # eval tooling itself
          node scripts/changed.mjs tessl-plugins "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/plugin-dirs.txt"
          if [ -s "$RUNNER_TEMP/plugin-dirs.txt" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changed plugins:"
            cat "$RUNNER_TEMP/plugin-dirs.txt"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The changed plugins have no scenarios in evals/ — nothing to eval."
          fi

      - name: Post skip summary (no qualifying plugins)
        if: steps.detect.outputs.skip == 'true'
        run: |
          {
            echo "## Skill Eval"
            echo ""
            echo "No qualifying skills to evaluate — either no plugin was changed, or the changed plugins have no scenarios in \`evals/\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        if: steps.detect.outputs.skip != 'true'
        with:
          # renovate: datasource=npm depName=@tessl/cli
          version: '0.122.0'
          token: ${{ secrets.TESSL_TOKEN }}

      # tessl eval run reads a plugin from its .tessl-plugin/plugin.json, which x927 generates
      # from the root plugin.json after the merge: a new plugin has none on its own pull
      # request. Evaluate the manifests as they will be on main. Nothing here is committed.
      - name: Build the plugin manifests in this checkout
        if: steps.detect.outputs.skip != 'true'
        run: npm ci --ignore-scripts && npm run plugins:build

      # tessl eval run saves a run to the Tessl project that the nearest tessl.json above the
      # plugin names, and fails without one ("No Tessl project found"). Only
      # edge-delivery-services brings its own: {"name": "adobe/<Tessl name>", "mode":
      # "vendored"}. Every other plugin to evaluate gets the same file, named after its
      # Tessl target, in this checkout only. Nothing is committed and no project is created.
      # The name must be a project that exists in the adobe workspace on Tessl, with this
      # repository and the plugin's folder as its source: otherwise the eval fails with
      # "tessl.json links to a project that was not found or is not accessible".
      - name: Give each plugin a tessl.json in this checkout
        if: steps.detect.outputs.skip != 'true'
        run: |
          # shellcheck disable=SC2016 # the single quotes hold JavaScript
          while IFS= read -r dir; do
            [ -f "$dir/tessl.json" ] && continue
            node -e '
              const { readFileSync, writeFileSync } = require("node:fs");
              const dir = process.argv[1];
              const { name } = JSON.parse(readFileSync(`${dir}/.tessl-plugin/plugin.json`, "utf8"));
              writeFileSync(`${dir}/tessl.json`, `${JSON.stringify({ name, mode: "vendored", dependencies: {} }, null, 2)}\n`);
              console.log(`${dir}/tessl.json: ${name}`);
            ' "$dir"
          done < "$RUNNER_TEMP/plugin-dirs.txt"

      # Which Tessl projects have this repository as their source: read only, for the log
      # when an eval can't find its project. Names and paths only.
      - name: Tessl projects of this repository
        if: steps.detect.outputs.skip != 'true'
        continue-on-error: true
        # the organization by id: by name, the project calls of this token answer 404
        env:
          TESSL_ORG: d2f8c474-86e0-4ebd-958f-46310dac0f0c
        run: |
          # shellcheck disable=SC2016 # the single quotes hold JavaScript
          { tessl project list --workspace adobe --json || tessl project list --json; } | node -e '
            let text = ""; process.stdin.on("data", (c) => (text += c)).on("end", () => {
              const found = [];
              const visit = (v) => {
                if (Array.isArray(v)) return v.forEach(visit);
                if (!v || typeof v !== "object") return;
                const a = v.attributes ?? v;
                if (typeof a.sourceUri === "string" && /adobe\/skills/i.test(a.sourceUri)) found.push(`${a.workspaceName ?? a.workspace?.name ?? "?"}/${a.name} <- ${a.repoSubpath || "(root)"}`);
                else Object.values(v).forEach(visit);
              };
              try { visit(JSON.parse(text)); } catch { console.log("unreadable answer"); }
              console.log(found.length ? found.join("\n") : "none");
            });'

      - name: Run evals
        id: run-evals
        if: steps.detect.outputs.skip != 'true'
        # the tessl-eval job reads the result and decides
        continue-on-error: true
        env:
          # seconds to wait for each plugin's run: edge-delivery-services has 34 scenarios,
          # and 19 of them took about 9 minutes
          TIMEOUT: '3600'
        run: node scripts/tessl-eval.mjs "$RUNNER_TEMP/plugin-dirs.txt" "$RUNNER_TEMP/eval-comment.md"

      - name: Comment eval results on PR
        if: always() && steps.run-evals.outputs.has_results == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          printf '\n_Triggered by commit %s_\n' "$(git log -1 --format=%s)" >> "$RUNNER_TEMP/eval-comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/eval-comment.md"

  # The check to look at. It fails when an eval failed, timed out or could not start, and
  # passes when every eval passed or there was nothing to evaluate. It is skipped when no
  # eval was requested, and when the Tessl organization has run out of credits: nothing
  # ran, and that says nothing about the skills.
  tessl-eval:
    needs: run-evals
    if: ${{ !cancelled() && needs.run-evals.result != 'skipped' && needs.run-evals.outputs.outcome != 'no-credits' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          JOB: ${{ needs.run-evals.result }}
          STEP: ${{ needs.run-evals.outputs.step }}
          OUTCOME: ${{ needs.run-evals.outputs.outcome }}
        run: |
          if [ "$JOB" != success ] || [ "$STEP" = failure ] || [ "$OUTCOME" = failed ]; then
            echo "::error::The Tessl evals failed (job: $JOB, eval step: ${STEP:-not run}, outcome: ${OUTCOME:-none}). The run-evals job has the results."
            exit 1
          fi
          echo "Tessl evals: ${OUTCOME:-nothing to evaluate}"
