name: Tessl Skill Eval

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Whether the last commit asks for evals, and whether they can run. The request is the
  # commit message; nobody has to approve it. A pull request from a fork gets no
  # TESSL_TOKEN on pull_request, so it can ask but not run.
  eval-requested:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.trigger.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check eval trigger
        id: trigger
        env:
          HAS_TOKEN: ${{ secrets.TESSL_TOKEN != '' }}
        run: |
          LAST_MSG=$(git log -1 --format=%s)
          echo "commit_message=$LAST_MSG"
          if [[ "$LAST_MSG" =~ ^eval: ]] && [ "$HAS_TOKEN" != true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Skill Eval"
              echo ""
              echo "Eval requested, but \`TESSL_TOKEN\` is not available to this run. Pull requests from forks get no secrets:"
              echo "ask a maintainer to run the evals from a branch in this repository."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Skill Eval::Evals were requested but can't run for a pull request from a fork"
          elif [[ "$LAST_MSG" =~ ^eval: ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Eval triggered by commit: $LAST_MSG"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Skill Eval"
              echo ""
              echo "Eval not requested — last commit message does not start with \`eval:\`."
              echo "To trigger evals, create a commit with a message like:"
              echo "\`\`\`"
              echo 'git commit --allow-empty -m "eval: test building-blocks changes"'
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  tessl-eval:
    needs: eval-requested
    if: needs.eval-requested.outputs.run == 'true'
    runs-on: ubuntu-latest
    # No environment: TESSL_TOKEN is a repository secret, so an approval step here never
    # kept a branch of this repository from using it. It only made every eval wait for a person.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Detect changed plugins
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # the Tessl plugins this pull request touches; all of them if it changes
          # something under plugins/ that belongs to none
          node scripts/changed.mjs tessl-plugins "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/plugin-dirs.txt"
          if [ -s "$RUNNER_TEMP/plugin-dirs.txt" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changed plugins:"
            cat "$RUNNER_TEMP/plugin-dirs.txt"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Changed files don't belong to any plugin — nothing to eval."
          fi

      - name: Post skip summary (no qualifying plugins)
        if: steps.detect.outputs.skip == 'true'
        run: |
          {
            echo "## Skill Eval"
            echo ""
            echo "No qualifying skills to evaluate — either no skill files were changed or changed skills have no \`.tessl-plugin/plugin.json\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: tesslio/setup-tessl@v2
        if: steps.detect.outputs.skip != 'true'
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Run evals
        id: run-evals
        if: steps.detect.outputs.skip != 'true'
        run: node scripts/tessl-eval.mjs "$RUNNER_TEMP/plugin-dirs.txt" "$RUNNER_TEMP/eval-comment.md"

      - name: Comment eval results on PR
        if: always() && steps.run-evals.outputs.has_results == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          printf '\n_Triggered by commit %s_\n' "$(git log -1 --format=%s)" >> "$RUNNER_TEMP/eval-comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/eval-comment.md"
