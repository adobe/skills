name: Merge Policy

# Applies the merge policy of CONTRIBUTING.md to the open pull requests, every hour:
# - an agent's pull request (without the `human` label) that left a finding of the AI review
#   unanswered for 24 hours is closed;
# - a pull request that waited a week for its code owners gets the `takeover` label, and
#   loses it when an owner acts.
# It reads the pull requests and runs nothing from them: the script comes from main.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: One pull request number; empty for all open ones
        required: false
      apply:
        description: Change the pull requests; off only says what it would do
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: merge-policy
  cancel-in-progress: false

jobs:
  merge-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Apply the merge policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          if [ -n "$PR" ]; then args+=(--pr "$PR"); fi
          node scripts/pr-policy.mjs "${args[@]}"
