name: Tessl Skill Review

on:
  push:
    branches: [main]
  # pull_request_target (instead of pull_request) so the review job can access
  # TESSL_TOKEN on PRs from forks; secrets are never exposed to plain
  # `pull_request` fork runs. Fork runs by authors without write access are gated
  # by the `fork-review` environment below.
  pull_request_target:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tessl-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this run needs a maintainer's approval first. It does when the pull request
  # comes from a fork and its author has no write access to this repository: then
  # TESSL_TOKEN would reach content from someone who could not have pushed it here.
  # Everything else runs unattended: pull requests from branches of this repository, push
  # to main, and forks of people with write access. If the permission can't be read, the
  # run waits for approval.
  approval:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.author.outputs.environment }}
    steps:
      - id: author
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          environment=''
          if [ "$EVENT" = pull_request_target ] && [ "$FORK" = true ]; then
            permission=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo unknown)
            echo "$AUTHOR has $permission permission on $REPO"
            case "$permission" in
              admin | write) ;;
              *) environment=fork-review ;;
            esac
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

  tessl-review:
    needs: approval
    runs-on: ubuntu-latest
    # `fork-review` has required reviewers; an empty environment has none.
    environment: ${{ needs.approval.outputs.environment }}
    steps:
      # The scripts below run with TESSL_TOKEN, so they come from the base of the pull
      # request (or the pushed commit), never from the pull request itself. They are taken
      # out of the workspace before the pull request is checked out into it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: .trusted
          sparse-checkout: scripts
          persist-credentials: false
      - run: |
          mv .trusted/scripts "$RUNNER_TEMP/scripts"
          rm -rf .trusted
          echo "SCRIPTS=$RUNNER_TEMP/scripts" >> "$GITHUB_ENV"

      # Fork PRs: review the merged result via the PR merge ref.
      # Push to main: use the pushed commit.
      #
      # actions/checkout refuses a fork's code on pull_request_target unless told
      # otherwise, which failed every Tessl review of a fork. Here the tree is data: the
      # scripts that run come from the base (above), tessl reads the skills, and no token
      # is left in the checkout. An author without write access has been approved in the
      # fork-review environment by the time this runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Check prerequisites
        id: prereq
        env:
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
        run: |
          if [ -z "$TESSL_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "TESSL_TOKEN is not available — skipping review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post skip summary (Tessl not configured)
        if: steps.prereq.outputs.skip == 'true'
        run: |
          {
            echo "## Skill Review"
            echo ""
            echo "Review skipped — \`TESSL_TOKEN\` is not configured for this repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        if: steps.prereq.outputs.skip != 'true'
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.prereq.outputs.skip != 'true'
        with:
          node-version: '24'

      - name: Detect changed skills
        id: detect
        if: steps.prereq.outputs.skip != 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request_target ]; then
            # both commits are reachable from the merge commit, so this is exactly the pull request's change
            node "$SCRIPTS/changed.mjs" skills "$BASE" "$HEAD" > "$RUNNER_TEMP/skill-dirs.txt"
          else
            # push to main: the skills this push changed
            node "$SCRIPTS/changed.mjs" skills HEAD~1...HEAD > "$RUNNER_TEMP/skill-dirs.txt"
          fi
          if [ -s "$RUNNER_TEMP/skill-dirs.txt" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changed skills:"
            cat "$RUNNER_TEMP/skill-dirs.txt"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No skill files changed."
          fi

      - name: Post skip summary
        if: steps.prereq.outputs.skip != 'true' && steps.detect.outputs.skip == 'true'
        run: |
          {
            echo "## Skill Review"
            echo ""
            echo "No skills changed — review skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Review skills
        if: steps.prereq.outputs.skip != 'true' && steps.detect.outputs.skip != 'true'
        env:
          THRESHOLD: '80'
          # Tessl workspace the review runs are attributed to: the registry namespace of this
          # repository's plugins (.tessl-plugin/plugin.json "name": "adobe/...")
          WORKSPACE: adobe
        run: node "$SCRIPTS/tessl-review.mjs" "$RUNNER_TEMP/skill-dirs.txt"
