name: Release Skills

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip release commits to avoid infinite loops
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Use a token with push access so commits from semantic-release trigger CI
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pull requests change a plugin's root plugin.json and leave the manifests that x927
      # generates from it alone (Validate Skills checks that). This is where they are built:
      # one commit on main with what changed, before anything is released or published, so
      # that the Tessl publish below sees the new version.
      - name: Rebuild the plugin manifests from each plugin.json, and push them
        env:
          BRANCH: ${{ github.ref_name }}
        run: npm run plugins:rebuild

      - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Detect changed skills
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # the skills this push changed, and the web CLI; a range git can't resolve
          # (a force push) falls back to the working tree against HEAD
          node scripts/changed.mjs release "$BEFORE..$AFTER" --fallback HEAD > "$RUNNER_TEMP/release-dirs.txt"
          if [ -s "$RUNNER_TEMP/release-dirs.txt" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changed skills:"
            cat "$RUNNER_TEMP/release-dirs.txt"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No skill directories changed."
          fi

      - name: Release changed skills
        if: steps.detect.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/release-skills.mjs "$RUNNER_TEMP/release-dirs.txt"

      # A plugin with a root plugin.json gets its version from semantic-release too, from
      # the commits that touch it. A change to one of its skills releases the plugin as
      # well: Claude Code keeps an installed plugin at its version until that changes.
      - name: Detect changed plugins
        id: plugins
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          node scripts/changed.mjs plugins "$BEFORE..$AFTER" --fallback HEAD > "$RUNNER_TEMP/plugin-dirs.txt"
          if [ -s "$RUNNER_TEMP/plugin-dirs.txt" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changed plugins:"
            cat "$RUNNER_TEMP/plugin-dirs.txt"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No plugin with a root plugin.json changed."
          fi

      - name: Release changed plugins
        if: steps.plugins.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/release-plugins.mjs "$RUNNER_TEMP/plugin-dirs.txt"

      - name: Publish changed plugins
        env:
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/publish-tessl-plugins.mjs "$BEFORE" "$AFTER"
