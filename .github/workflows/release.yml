name: Release Skills

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip release commits to avoid infinite loops
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use a token with push access so commits from semantic-release trigger CI
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Detect changed skills
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # the skills this push changed, and the web CLI; a range git can't resolve
          # (a force push) falls back to the working tree against HEAD
          node scripts/changed.mjs release "$BEFORE..$AFTER" --fallback HEAD > "$RUNNER_TEMP/release-dirs.txt"
          if [ -s "$RUNNER_TEMP/release-dirs.txt" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changed skills:"
            cat "$RUNNER_TEMP/release-dirs.txt"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No skill directories changed."
          fi

      - name: Release changed skills
        if: steps.detect.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
        run: node scripts/release-skills.mjs "$RUNNER_TEMP/release-dirs.txt"

      - name: Publish changed plugins
        env:
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/publish-tessl-plugins.mjs "$BEFORE" "$AFTER"
