name: Tessl Plugin Lint

# Whether every plugin that has a Tessl manifest is valid. Warnings don't fail here and
# are not posted on the pull request: the boy-scout job of the Validate workflow holds a
# pull request to the warnings of the files it changes (scripts/tessl-lint-debt.mjs).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tessl-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e  # v2

      - name: Lint every plugin that has a Tessl manifest
        run: |
          failed=0
          while IFS= read -r manifest; do
            dir=${manifest%/.tessl-plugin/plugin.json}
            echo "::group::$dir"
            if ! tessl plugin lint "$dir"; then
              failed=1
              echo "::error file=$manifest::tessl plugin lint failed for $dir"
            fi
            echo "::endgroup::"
          done < <(find plugins -path '*/.tessl-plugin/plugin.json' | sort)
          exit "$failed"
