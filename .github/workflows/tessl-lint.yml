name: Tessl Plugin Lint

# Whether the Tessl manifest of every plugin is valid. Every plugin has one, because every
# plugin is published to the Tessl registry. Warnings don't fail here and
# are not posted on the pull request: the boy-scout job of the Validate workflow holds a
# pull request to the warnings of the files it changes (scripts/tessl-lint-debt.mjs).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tessl-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e  # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      # The Tessl manifests are generated from each plugin's root plugin.json, and a pull
      # request changes only that. Lint them as they will be on main.
      - name: Build the plugin manifests in this checkout
        run: npm ci --ignore-scripts && npm run plugins:build

      - name: Lint every plugin
        run: |
          failed=0
          while IFS= read -r manifest; do
            dir=${manifest%/.tessl-plugin/plugin.json}
            echo "::group::$dir"
            if ! tessl plugin lint "$dir"; then
              failed=1
              echo "::error file=$manifest::tessl plugin lint failed for $dir"
            fi
            echo "::endgroup::"
          done < <(find plugins -path '*/.tessl-plugin/plugin.json' | sort)
          exit "$failed"
