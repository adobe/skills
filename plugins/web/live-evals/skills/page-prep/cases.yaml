# Checked after the run in the agent's own browser session, so the page must be left open.
- description: fixture, cookie banner (reject, never accept)
  vars:
    check: banner
    url: http://localhost:8765/overlay-cookie.html
    heading: Harbor Weather
    overlay: '#cookie-banner'
- description: fixture, newsletter modal with scroll lock
  vars:
    check: modal
    url: http://localhost:8765/overlay-modal.html
    heading: Orchard Journal
    overlay: '#backdrop'
- description: 20minutes.fr consent wall
  vars:
    check: residual
    url: https://www.20minutes.fr/
    heading: ''
    overlay: ''
- description: live, backlinko.com CookieHub dialog
  vars:
    check: live-overlay
    url: https://backlinko.com/
    heading: ''
    overlay: '#ch2-dialog'
- description: live, allbirds.com Shopify privacy banner (agent fallback, the CLI misses it)
  vars:
    check: live-overlay
    url: https://www.allbirds.com/
    heading: ''
    overlay: '#shopify-pc__banner'
