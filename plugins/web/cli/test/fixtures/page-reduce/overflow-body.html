<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Absolutely positioned content</title>
    <style>
      body {
        margin: 0;
      }
      .note {
        position: absolute;
        top: 30px;
        left: 20px;
        width: 480px;
      }
    </style>
  </head>
  <body>
    <div class="note">
      <h2>Positioned heading</h2>
      <p>Positioned text in a body whose own box has no height.</p>
    </div>
  </body>
</html>
