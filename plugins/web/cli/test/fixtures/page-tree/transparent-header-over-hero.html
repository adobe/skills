<!doctype html><meta charset="utf-8" /><title>Transparent header over a hero</title>
<link rel="stylesheet" href="_base.css" />
<style>
  /* Seen on a real site: the sticky wrapper collapses to 0 px, the nav sits over the hero. */
  .sticky-wrap {
    position: sticky;
    top: 0;
    height: 0;
    z-index: 1000;
  }
  .grid {
    height: 0;
  }
  #topNav {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    background: transparent;
    color: #fff;
  }
  .hero {
    height: 700px;
    background: linear-gradient(#5a2d82, #2d1b4e);
    color: #fff;
    padding: 160px 80px;
  }
</style>
<div id="utility">English · 日本語</div>
<div class="sticky-wrap">
  <div class="grid">
    <div class="inner">
      <div id="topNav" class="nav">
        <b>LOGO</b><a href="#">Why us</a><a href="#">Solutions</a> <a href="#">Products</a>
      </div>
    </div>
  </div>
</div>
<div class="hero"><h1>Introducing the thing</h1></div>
<div class="content">Body</div>
<div class="footer">Company · Resources · Legal</div>
