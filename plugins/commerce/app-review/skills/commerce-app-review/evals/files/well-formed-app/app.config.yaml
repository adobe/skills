application:
  actions: actions
  productDependencies:
    - code: COMMC
      minVersion: 2.4.5
  runtimeManifest:
    packages:
      order-status:
        license: Apache-2.0
        inputs:
          LOG_LEVEL: $LOG_LEVEL
          AIO_COMMERCE_CONFIG_ENCRYPTION_KEY: $AIO_COMMERCE_CONFIG_ENCRYPTION_KEY
        actions:
          get-order:
            function: actions/get-order/index.js
            web: 'yes'
            runtime: nodejs:24
            annotations:
              require-adobe-auth: true
              final: true
          list-orders:
            function: actions/list-orders/index.js
            web: 'yes'
            runtime: nodejs:24
            annotations:
              require-adobe-auth: true
              final: true
extensions:
  commerce/configuration/1:
    $include: src/commerce-configuration-1/ext.config.yaml
  commerce/extensibility/1:
    $include: src/commerce-extensibility-1/ext.config.yaml
