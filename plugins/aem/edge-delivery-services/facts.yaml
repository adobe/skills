- id: aem-cli-hlx-conflict
  claim: >-
    `npm install -g @adobe/aem-cli` fails with `EEXIST ... File exists: .../hlx`
    while the old `@adobe/helix-cli` package is installed, because both ship
    the `hlx` binary. Fix: `npm uninstall -g @adobe/helix-cli`, then install
    again.
  question: >-
    Installing `@adobe/aem-cli` globally fails with `File exists: .../hlx`.
    Why, and how do you fix it?
  source: "@adobe/aem-cli 16.22.16 README.md, 'npm install fails with File exists'"
  used_by:
    - skills/aem-cli/SKILL.md
    - evals/aem-cli-setup-and-troubleshooting

