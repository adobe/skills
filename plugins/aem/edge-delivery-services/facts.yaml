- id: cm-semantic-cells
  claim: >-
    A block cell holds default content (heading, paragraphs, links, picture).
    One cell per field (title, description, link in separate cells) is a smell;
    decoration finds parts by element type (h2, picture, a), not by cell
    index.
  question: >-
    In an EDS block, a feature card has an image, a title, a description and a link. Sketch the
