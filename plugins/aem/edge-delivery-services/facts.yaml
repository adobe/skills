# Facts the EDS skills and evals rely on.
# question: asked unaided to quiz whether models know the claim (the answer key).
# source: external and re-checkable only; omitted for maintainer-endorsed practice.
# used_by: paths relative to this plugin.

- id: block-collection
  claim: >-
    The Block Collection (github.com/adobe/aem-block-collection, `blocks/`) is
    Adobe's vetted reference set of common blocks. Each has a live example at
    `main--aem-block-collection--adobe.aem.live/block-collection/{block}`.
    Prefer it as the starting point for a standard block.
  question: >-
    Where are Adobe's reference implementations of common EDS blocks, and
    where can you see each one rendered?
  source: >-
    https://www.aem.live/developer/block-collection;
    github.com/adobe/aem-block-collection blocks/
  used_by:
    - skills/block-collection-and-party/SKILL.md
    - skills/block-inventory/SKILL.md

- id: block-party
  claim: >-
    Block Party is the community catalog (blocks, sidekick and DA plugins,
    build tooling, framework integrations, code snippets), indexed at
    `www.aem.live/developer/block-party/block-party.json?sheet=curated-list-new`;
    use only entries with `approved: TRUE` and review their code. It is the
    only catalog for plugins, build tooling and integrations.
  question: >-
    Where do you look for existing community implementations for EDS (a
    non-standard block, a sidekick or DA plugin, a Sass build setup), and what
    should you check before using one?
  source: https://www.aem.live/developer/block-party/
  used_by:
    - skills/block-collection-and-party/SKILL.md

- id: plain-html-content-model
  claim: >-
    Appending `.plain.html` to an EDS page URL returns its authored markup
    before decoration (blocks as `<div class="{block}">` rows and cells). On a
    Block Collection example page it shows the content model a block expects.
  question: >-
    How do you see the authored, pre-decoration markup that an existing EDS
    block expects, e.g. from a live example page?
  source: >-
    https://www.aem.live/developer/markup-sections-blocks;
    main--aem-block-collection--adobe.aem.live/block-collection/cards.plain.html
  used_by: []

- id: blocks-copied-not-installed
  claim: >-
    A project's blocks are the folders under `blocks/`. A reference block is
    added by copying its folder into `blocks/` and adapting it; there is no
    package to install.
  question: >-
    How do you find which blocks an EDS project has, and how do you add a
    block from Adobe's reference set?
  source: aem-boilerplate 5cea543, blocks/
  used_by: []

- id: block-collection-default-content
  claim: >-
    The Block Collection site also documents default content that has no block
    (breadcrumbs, buttons, metadata, section metadata). Its "breadcrumbs" entry
    is default-content documentation, not a standalone block to copy.
  question: >-
    We want breadcrumbs on an EDS site. Does Adobe's Block Collection have a
    breadcrumb block, and what would you start from?
  source: >-
    main--aem-block-collection--adobe.aem.live nav; search-block-collection.js
    breadcrumb output (2026-11-11)
  used_by:
    - skills/block-collection-and-party/SKILL.md

- id: block-css-scoping
  claim: >-
    Block selectors start with `.{block}` or `main .{block}`; both are valid.
    `main .{block}` excludes copies of the block in header/footer.
  question: >-
    How should selectors in an EDS block's CSS be written so they only affect
    that block? Example for a block named `cards`.
  source: aem-boilerplate 5cea543, blocks/*/*.css use `.{block}`
  used_by:
    - evals/css-block-scoping-and-custom-properties

- id: block-css-location
  claim: >-
    aem.js loads a block's styles from `blocks/{block}/{block}.css` when the
    block is on the page.
  question: Where does the CSS for an EDS block named `cards` live, and what loads it?
  source: aem-boilerplate 5cea543, scripts/aem.js loadBlock()
  used_by:
    - evals/css-block-scoping-and-custom-properties

- id: platform-wrapper-classes
  claim: >-
    aem.js adds `{block}-wrapper` to the block's parent and `{block}-container`
    to its section. Don't reuse these names inside the block. They are where a
    block adjusts its outer layout (e.g. full bleed).
  question: >-
    What classes does EDS add around a block automatically, and how should
    block CSS treat them?
  source: aem-boilerplate 5cea543, scripts/aem.js decorateBlock()
  used_by:
    - evals/css-block-scoping-and-custom-properties
    - skills/building-blocks/SKILL.md

- id: css-targets-decorated-dom
  claim: >-
    Block CSS styles the DOM after decorate() runs, not the authored row/cell divs.
  question: Does an EDS block's CSS target the authored markup or something else?
  source: >-
    aem-boilerplate 5cea543, scripts/aem.js loadBlock() runs CSS load and
    decorate() together and marks the block loaded after both
  used_by:
    - evals/css-block-scoping-and-custom-properties

- id: root-custom-properties
  claim: >-
    Colors, font families and font sizes are custom properties declared on
    `:root` in styles/styles.css (`:root, :host` in projects embedded with
    aem-embed, which loads styles.css into a shadow root where `:root` matches
    nothing). Blocks reference them instead of repeating their values, which
    drift.
  question: >-
    Our EDS site is embedded on a partner page with aem-embed, and the block
    colors and fonts fall back to browser defaults there. Why, and what's the
    fix?
  source: >-
    aem-boilerplate 5cea543, styles/styles.css :root; adobe/aem-embed
    scripts/aem-embed.js
  used_by:
    - evals/css-block-scoping-and-custom-properties
    - skills/building-blocks/SKILL.md

- id: block-layout-scope
  claim: >-
    Global styles define the page grid (`main > .section > div` sets max-width,
    centering and inline padding). Blocks don't override it on the block root;
    outer layout changes (e.g. full bleed) go through `{block}-container` /
    `{block}-wrapper`, not viewport hacks like `calc(50% - 50vw)` or `100vw`.
    Inner padding is the block's call.
  question: >-
    An EDS block needs a full-width background while its content stays aligned
    with the rest of the page. How?
  source: aem-boilerplate 5cea543, styles/styles.css
  used_by:
    - evals/css-block-scoping-and-custom-properties
    - skills/building-blocks/SKILL.md

- id: mobile-first-breakpoints
  claim: >-
    CSS is mobile-first: defaults are mobile, wider layouts in min-width queries.
    Use the project's breakpoints. 600/900/1200px is the common convention;
    current boilerplate uses only 900px.
  question: What responsive approach and breakpoints does EDS block CSS use?
  source: >-
    aem-boilerplate 5cea543, every @media is `(width >= 900px)`; 600px removed
    in 4a3d34f (2024-05-29)
  used_by:
    - evals/css-block-scoping-and-custom-properties

- id: block-variant-classes
  claim: >-
    Block options are extra classes on the block element (`Columns (dark, wide)`
    → `class="columns dark wide"`), styled as `.{block}.{option}`. An option
    that only changes looks needs no JS.
  question: How do authors create a variant of an EDS block, and how is it styled?
  source: https://www.aem.live/developer/markup-sections-blocks (block options)
  used_by:
    - evals/css-block-scoping-and-custom-properties
    - evals/javascript-block-decoration-patterns

- id: css-logical-properties
  claim: >-
    Use logical properties: `padding-inline`, `margin-block`,
    `inset-inline-start` instead of left/right/top/bottom physical ones.
  question: >-
    In block CSS, how do you set horizontal padding and position an absolutely
    positioned element's start edge?
  used_by: []

- id: flex-grid-gap
  claim: >-
    Space flex and grid items with `gap`, not margins on the items or negative
    margins on the container.
  question: How do you space items in a flex or grid layout?
  used_by:
    - evals/css-block-scoping-and-custom-properties

- id: block-js-contract
  claim: >-
    aem.js imports `blocks/{block}/{block}.js` and awaits its default export,
    called with the block element. It may be async.
  question: >-
    What does the JavaScript file of an EDS block named `cards` look like, and
    how does the platform call it?
  source: aem-boilerplate 5cea543, scripts/aem.js loadBlock()
  used_by:
    - evals/javascript-block-decoration-patterns

- id: decorate-gates-section
  claim: >-
    A section stays hidden until every block in it has been decorated, and the
    first section is loaded before anything else (LCP). Slow work awaited in
    decorate() (fetches, big imports, third-party embeds) delays the section;
    defer it, e.g. until the block is in view, and reserve its space so the
    late content doesn't shift the layout (CLS).
  question: >-
    What happens to the page if an EDS block's decorate() awaits a slow fetch
    or library load, and how should such work be handled?
  source: >-
    aem-boilerplate 5cea543, scripts/aem.js loadSection(), scripts/scripts.js
    loadEager()
  used_by:
    - evals/block-file-structure-and-performance-pat
    - skills/building-blocks/SKILL.md

- id: reuse-authored-dom
  claim: >-
    decorate() moves the delivered elements (pictures, headings, paragraphs,
    links) into the new structure instead of copying their text or src into new
    elements. Copies lose attributes such as heading ids, image dimensions and
    Universal Editor instrumentation (`data-aue-*`).
  question: >-
    In an EDS block's decorate(), how do you turn the authored heading and
    image into your own markup?
  source: >-
    adobe-rnd/aem-boilerplate-xwalk scripts/scripts.js moveInstrumentation()
  used_by:
    - evals/javascript-block-decoration-patterns

- id: delivered-pictures
  claim: >-
    Authored images arrive as `<picture>` with webp and fallback sources at
    2000/750px widths. Keep it, or rebuild it at another size with
    `createOptimizedPicture()` from aem.js; don't build a bare `<img>` from its
    src.
  question: >-
    In what form do authored images reach an EDS block, and how do you render
    one at a smaller size?
  source: >-
    aem-boilerplate 5cea543, scripts/aem.js createOptimizedPicture(),
    blocks/cards/cards.js
  used_by:
    - evals/javascript-block-decoration-patterns

- id: authored-cells-vary
  claim: >-
    Authors leave cells out and add extra ones, so decorate() can't assume a
    fixed row/cell shape; find content by what it is (e.g. the cell with a
    picture), not by index alone.
  question: >-
    An EDS block's content model says each row has an image cell and a text
    cell. What should decorate() assume about the rows it gets?
  source: aem-boilerplate 5cea543, AGENTS.md
  used_by:
    - evals/javascript-block-decoration-patterns

- id: block-dom-scope
  claim: >-
    decorate() queries and changes only its own block. It does not query the
    document or change the header, section or other blocks.
  question: >-
    Can an EDS block's decorate() look up or change elements outside the block?
  used_by:
    - evals/javascript-block-decoration-patterns

- id: aem-js-vendored
  claim: >-
    `scripts/aem.js` is vendored and never edited. Blocks import its helpers
    (`createOptimizedPicture`, `readBlockConfig`, `toClassName`, `getMetadata`,
    `loadCSS`, `loadScript`) as `../../scripts/aem.js`; project helpers go in
    scripts.js or another file under `scripts/`.
  question: >-
    What is `scripts/aem.js` in an EDS project, can you change it, and how do
    blocks use it?
  source: aem-boilerplate 5cea543, AGENTS.md, scripts/aem.js exports
  used_by:
    - evals/javascript-block-decoration-patterns

- id: no-build-step
  claim: >-
    Code is served as-is as browser ES modules: no bundler, no transpiling, no
    npm runtime dependencies (devDependencies only). Imports use relative paths
    with `.js`; third-party scripts load with `loadScript()` or are copied into
    the repo.
  question: >-
    How do you add a third-party library to an EDS block, and how are block
    imports written?
  source: aem-boilerplate 5cea543, AGENTS.md, .eslintrc.js import/extensions
  used_by:
    - evals/javascript-block-decoration-patterns

- id: project-lint
  claim: >-
    Boilerplate projects lint JS with ESLint airbnb-base (`.js` import
    extensions required, property reassignment on parameters allowed) and CSS
    with stylelint-config-standard, via `npm run lint`.
  question: What lint setup does an EDS boilerplate project use, and how do you run it?
  source: aem-boilerplate 5cea543, package.json, .eslintrc.js, .stylelintrc.json
  used_by:
    - evals/javascript-block-decoration-patterns

- id: no-innerhtml
  claim: >-
    Build block markup with DOM APIs, not `innerHTML` strings: strings drop the
    authored nodes and their attributes, and risk XSS.
  question: >-
    In an EDS block's decorate(), is it fine to build the new markup as an HTML
    string and assign it with innerHTML?
  used_by:
    - evals/javascript-block-decoration-patterns
    - skills/building-blocks/SKILL.md

- id: programmatic-blocks
  claim: >-
    To add a block from code, `buildBlock(name, cells)` creates it; it only
    renders after `decorateBlock()` and `loadBlock()`, unless it is built in
    `buildAutoBlocks()` before the page's blocks are decorated.
  question: >-
    How do you create and render an EDS block from JavaScript instead of
    authoring it?
  source: aem-boilerplate 5cea543, scripts/aem.js, scripts/scripts.js decorateMain()
  used_by: []

- id: martech-after-consent
  claim: >-
    Martech and analytics scripts load last: `loadDelayed()` imports
    `consent-check.js`, which loads `consented.js` once the user consents.
    Never add them to head.html or the eager/lazy phases.
  question: >-
    Where do you add a third-party analytics or marketing tag in an EDS
    project?
  source: >-
    aem-boilerplate 5cea543, scripts/scripts.js loadDelayed(),
    scripts/consent-check.js
  used_by:
    - skills/building-blocks/SKILL.md

- id: cm-no-nested-blocks
  claim: >-
    Blocks must never be nested: a table inside a block's cell is unsupported
    and hard for authors. To combine structures, put blocks side by side in
    sections (a script can merge consecutive sections, e.g. via Section
    Metadata, into tabs) or link to a fragment.
  question: >-
    In an AEM Edge Delivery Services (EDS) site, a tabs block needs a cards grid
    inside each tab. How do authors create that in Word or Google Docs?
  source: >-
    https://www.aem.live/docs/davidsmodel (Rule 2);
    https://www.aem.live/developer/markup-sections-blocks ("Blocks should never be nested")
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-default-content-first
  claim: >-
    Headings, paragraphs, images, lists and links stay default content. A
    `Text`, `Heading` or `Image` block is an anti-pattern. A block is justified
    only when content needs structure (repeating items, interaction, layout),
    and variants or blocks that can be inferred from the content should be.
  question: >-
    On an EDS site, a design shows an intro section: a small label, an H2, two paragraphs and
    one centered image below them. What do authors create on the page?
  source: >-
    https://www.aem.live/docs/davidsmodel (Rule 1);
    https://www.aem.live/developer/markup-sections-blocks (Default Content)
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-key-value-config-only
  claim: >-
    Name/value rows are for configuration that is not displayed (like section
    metadata, which becomes `data-` attributes). Displayed content such as a
    heading, image or text must not be modelled as name/value pairs.
  question: >-
    On an EDS site, a pricing block shows, per tier, a name, a price, a feature list and a
    button. A developer proposes a two-column table with a label in the left
    cell and the value in the right. Do you accept that model?
  source: https://www.aem.live/docs/davidsmodel (Rule 14)
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-tabular-data-spreadsheet
  claim: >-
    Many columns usually mean content is split into small values instead of
    default-content semantics. For real tabular data, small amounts shown on
    one page can use the Block Collection `table` block; large or reused data
    belongs in a spreadsheet (published as JSON) that a block links to, rather
    than a wide custom block table.
  question: >-
    On an EDS site, a comparison block shows 8 features across 5 plans (a 9 by 6 grid of
    ticks and short values). How do authors provide that data?
  source: https://www.aem.live/docs/davidsmodel (Rule 10); Block Collection `table` block
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-semantic-cells
  claim: >-
    A block cell holds default content (heading, paragraphs, links, picture).
    One cell per field (title, description, link in separate cells) is a smell;
    decoration finds parts by element type (h2, picture, a), not by cell
    index.
  question: >-
    In an EDS block, a feature card has an image, a title, a description and a link. Sketch the
    table an author fills in for one card, and say how your decorate() finds
    each part.
  source: https://www.aem.live/docs/davidsmodel (Rule 10); https://www.aem.live/developer/markup-sections-blocks
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-block-options
  claim: >-
    Authors choose a variant in the block's header cell in parentheses:
    `Columns (dark, wide)` adds classes `columns dark wide`; a multi-word
    option is hyphenated (`super wide` becomes `super-wide`). Prefer this to a
    `style | dark` config row.
  question: >-
    One EDS quote block must come in a dark look and a wide look, chosen per
    instance by the author. How does the author choose, and what does the
    block element carry?
  source: https://www.aem.live/developer/markup-sections-blocks (Block Options)
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-simple-link-lists
  claim: >-
    Simple lists of links need no list: put the links in one cell (or one per
    line) and have decorate() collect every link. Use one row per item only
    when items are complex (image, heading, text, link).
  question: >-
    An EDS related-articles block shows 6 links to other pages. How do authors
    enter them, and what must the block accept?
  source: https://www.aem.live/docs/davidsmodel (Rule 5)
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-fragments-cost
  claim: >-
    Fragments suit identical content reused on many pages (header, footer,
    sign-up form, legal text). Authors then see only a reference, nested
    fragments are worse, and SEO-relevant content must stay on the page.
  question: >-
    An EDS product page repeats a legal disclaimer used on 200 pages and also has a
    long intro text that matters for search. Where would you use fragments?
  source: https://www.aem.live/docs/davidsmodel (Rule 12)
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-no-alt-text-config
  claim: >-
    Do not hide configuration in image alt text: authors cannot see it, and
    copy/paste can drop it silently.
  question: >-
    Each image in an EDS gallery block needs an optional "featured" flag. Where in
    the content model does the author set it?
  source: https://www.aem.live/docs/davidsmodel (Rule 13)
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-auto-block-links
  claim: >-
    A link alone in its paragraph can be auto-blocked into a block (e.g.
    YouTube `embed`, fragment, modal) in `buildAutoBlocks()` of `scripts.js`,
    so authors paste a URL and create no table.
  question: >-
    On an EDS site, authors should add a YouTube video to a page without building a table.
    What makes that work?
  source: https://www.aem.live/developer/markup-sections-blocks (Auto Blocking)
  used_by: []

- id: cm-widgets-not-blocks
  claim: >-
    Application-like parts (forms, search, filters, calculators, dealer
    locators) are widgets, not blocks: a `/widgets/<name>/` folder with .html,
    .css and .js, and authors paste the widget's .html URL alone in a
    paragraph, which renders a `widget` block. Query-string parameters become
    `data-` attributes. No table to author.
  question: >-
    An EDS site needs a contact form and a mortgage calculator, each on one or two
    pages. What do authors put in the document, and where does the code live?
  source: https://www.aem.live/docs/widgets; aem-boilerplate 5cea543 blocks/widget
  used_by:
    - skills/content-modeling/SKILL.md

# ue-component-model facts, checked against aem.live docs and aem-boilerplate-xwalk 6210531 (2026-11-12).

# ue-component-model facts, checked against aem.live docs and aem-boilerplate-xwalk 6210531 (2026-11-12).

- id: ue-block-table-mapping
  claim: >-
    In AEM authoring with the Universal Editor, a simple block renders each
    model property (or group) as one row with a single column, in model order.
    A container block renders its own properties as single-column rows first,
    then each child item as a row with one column per property.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, a hero
    block's model lists image, imageAlt and text, in that order. What block
    markup reaches the browser?
  source: https://www.aem.live/developer/component-model-definitions (Block structure)
  used_by: []

- id: ue-field-collapse
  claim: >-
    Properties ending in the case-sensitive suffixes `Title`, `Type`,
    `MimeType`, `Alt` or `Text` are not values but attributes of the property
    they follow: `image` + `imageAlt` becomes one `<picture><img alt>`, `link` +
    `linkText` + `linkTitle` + `linkType` one `<a>` (type primary or secondary
    wraps it in strong or em), `heading` + `headingType` one heading.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, a block model has fields `cta`, `ctaText` and `ctaType` (value
    `primary`). What does the block's cell contain after rendering?
  source: https://www.aem.live/developer/component-model-definitions (Field collapse)
  used_by:
    - skills/ue-component-model/SKILL.md

- id: ue-element-grouping
  claim: >-
    Fields named `<group>_<field>` (underscore) are concatenated into a single
    cell, so an author gets separate fields (subtitle, title, description,
    buttons) while the block gets one cell of semantic elements.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, a teaser model needs a subtitle, title, description and two buttons that
    must end up as one text cell of semantic markup. How do you name the
    fields?
  source: https://www.aem.live/developer/component-model-definitions (Element grouping)
  used_by:
    - skills/ue-component-model/SKILL.md

- id: ue-classes-block-options
  claim: >-
    A `classes` property becomes the block options in the table header (class
    names on the block). `classes_<name>` fields extend it; a boolean `classes_`
    field adds its name as an option when true.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, how do you let authors pick a background color and toggle a
    full-width option so both end up as classes on the block element?
  source: https://www.aem.live/developer/component-model-definitions (Type inference; Element Grouping for Block Options)
  used_by:
    - skills/ue-component-model/SKILL.md

- id: ue-nesting-sections
  claim: >-
    The content model allows one level of nesting: a section contains default
    content or blocks. A component that contains other components (tabs,
    accordion) is modelled as sections (resource type
    `core/franklin/components/section/v1/section`, e.g. a `tab` definition)
    that client-side auto-blocking combines.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, tabs must each hold a cards block. How do you define this
    in the component definitions?
  source: https://www.aem.live/developer/component-model-definitions (end of Blocks section)
  used_by:
    - skills/ue-component-model/SKILL.md
    - evals/ue-tabs-cards

- id: ue-multifield-flag
  claim: >-
    Multi-field rendering (`multi: true` fields) is off by default. Enable it
    with `public.xwalk.multi-field.enabled: true` in the Admin Configuration
    API site config or in `xwalk.json` at the repo root. Otherwise multi values
    render as one comma-separated list.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, a block model has a `reference` field with `multi: true` for images, but
    the block receives one comma-separated string. Why, and how do you fix it?
  source: https://www.aem.live/developer/component-model-definitions (Multi-Fields)
  used_by:
    - skills/ue-component-model/SKILL.md
    - evals/ue-promo-banner-model

- id: ue-block-resource-type
  claim: >-
    Every block uses resource type `core/franklin/components/block/v1/block`
    and a template `name`; if either is missing the block does not render.
    Custom AEM components are not recommended: the markup is a fixed contract.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, a block was added to component-definition.json and shows in the UE palette,
    but renders nothing on the page. What do you check first?
  source: https://www.aem.live/developer/component-model-definitions (Block model definition)
  used_by:
    - skills/ue-component-model/SKILL.md

- id: ue-columns-no-model
  claim: >-
    The columns block has no content modeling in UE: it only has `rows`,
    `columns` and `classes` properties, and authors add only default content to
    its cells.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, can a model give a columns block a dedicated field for each column's
    content?
  source: https://www.aem.live/developer/component-model-definitions (Columns Block)
