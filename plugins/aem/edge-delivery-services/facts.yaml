- id: aem-cli-extra-ca-not-dotenv
  claim: >-
    Behind a TLS-intercepting proxy, `unable to get local issuer certificate`
    is fixed with `NODE_EXTRA_CA_CERTS=<corporate CA>` set in the shell or CI
    before `aem` starts. Node reads it only at process start, so putting it in
    `.env` has no effect.
  question: >-
    `aem up` fails with `unable to get local issuer certificate` on a corporate
    network. How do you fix it, and can the fix go in the project's `.env`?
  source: "Node.js docs, NODE_EXTRA_CA_CERTS; @adobe/aem-cli 16.22.16 src/cli.js loads .env after start"
  used_by:
    - skills/aem-cli/SKILL.md
    - evals/aem-cli-setup-and-troubleshooting

