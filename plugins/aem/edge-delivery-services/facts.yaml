- id: da-content-sections-required
  claim: >-
    Every piece of page content must be inside a section div that is a direct
    child of main. Elements placed directly in main (h1, p, ...) are dropped
    silently, with no error. A div placed directly in main is itself taken
    as a section, so a block div there is not a block: its rows become
    default content (a div.metadata outside a section yields no Metadata
    block and no <meta> tags). Blocks, metadata and default content all
    belong inside the section div.
  question: >-
    You emit <main><h1>Title</h1><p>Intro</p><div class="metadata">…</div></main>
    with nothing wrapping them in section divs. What survives preview, and
    what is the correct structure?
  source: "Live check 2026-11-06, shsteimer/da-playground /drafts/dc-nosec (direct children dropped), dc-pm (metadata as a section), dc-pmb (works inside a section)"
  used_by: []

- id: da-content-metadata-head-output
  claim: >-
    Page metadata rows become head tags: title -> <title>; description ->
    meta description + og:description + twitter:description; og:title also
    sets twitter:title; image -> og:image, twitter:image (absolute site URL
    with ?width=1200); tags -> one article:tag per comma value; other keys
    -> <meta name> with the key lowercased and spaces replaced by hyphens
    ("my custom" -> my-custom); a link value delivers as its text; canonical,
    og:url and twitter:card are added automatically.
  question: >-
    Which head tags does the EDS pipeline generate from a page metadata block
    with title, description, image, tags and a custom key "my custom"? Do you
    need to author og:* or twitter:* rows yourself?
  source: "Live check 2026-11-06, /drafts/dc-pmb full page head"
  used_by: []

- id: da-content-picture-generated
  claim: >-
    Every absolute <img> in DA HTML is sideloaded and delivered as a
    <picture> with two webp and one jpeg <source> (width 750 and 2000,
    media (min-width: 600px), format and optimize query params) and an <img>
    with width, height and loading="lazy". Hand-authored <picture>/<source>
    markup is replaced by the pipeline's. A relative or document-relative
    src delivers <img src="about:error"> with the alt kept. Missing alt
    becomes alt="". Inline <svg> is dropped.
  question: >-
    What does the pipeline deliver for <img src="https://…/a.jpg" alt="x"> in
    DA HTML? What if you hand-author <picture> with <source> elements, and
    what if src is "/img/a.png"?
  source: "Live check 2026-11-06, /drafts/dc-img .plain.html"
  used_by: []

- id: da-content-link-rewrite
  claim: >-
    Links to the same site's aem.page or aem.live URLs are rewritten to
    relative paths; other hosts stay absolute. class and target attributes on
    <a> are dropped, title is kept. Button promotion is not done by the
    pipeline (decoration does it, per project).
  question: >-
    You write <a href="https://main--site--org.aem.page/foo" class="button"
    target="_blank">. What does the delivered HTML contain?
  source: "Live check 2026-11-06, /drafts/dc-links .plain.html"
  used_by: []

- id: da-content-attrs-stripped
  claim: >-
    The pipeline drops id, class, style and data-* attributes on default
    content (headings get auto-generated ids from their text, also inside
    cells), drops empty <p> and <p><br></p>, turns <hr> into a section
    break, unwraps <span> and <ins>, rewrites <b>/<i>/<mark>/<s>/<kbd> to
    strong/em/em/del/code, and keeps <u>, <sup>, <sub>. This is the same in
    default content and block cells.
  question: >-
    Which inline tags and attributes does the pipeline keep, rewrite or strip
    in DA HTML, and does that differ between default content and block
    cells?
  source: "Live check 2026-11-06, /drafts/dc-def, dc-cell, dc-misc"
  used_by: []

- id: da-content-table-becomes-block
  claim: >-
    A <table> in default content (not in a block) is converted to a block:
    the first cell of the first row becomes the block name and is consumed.
    <table><tr><th>h</th></tr><tr><td>d</td></tr></table> is delivered as
    <div class="h">…d…</div>. A block nested inside a block cell is
    flattened to its text.
  question: >-
    What happens to a plain <table> with a header row in DA HTML that you
    meant as a data table? And to a block placed inside another block's cell?
  source: "Live check 2026-11-06, /drafts/dc-def, dc-blk"
  used_by: []

- id: da-content-block-name-normalize
  claim: >-
    The pipeline normalizes block class tokens: "Feature_Block" becomes
    class="feature-block", "columns (v)" becomes "columns v", table header
    "Hero (dark, wide)" becomes "hero dark wide". Authoring guidance in this
    repo stays alphanumeric plus single hyphens regardless.
  question: >-
    How are block names and variants in div and table form turned into CSS
    classes by the pipeline (case, underscores, parentheses)?
  source: "Live check 2026-11-06, /drafts/dc-blk .plain.html"
  used_by: []

