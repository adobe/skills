- id: cm-tabular-data-spreadsheet
  claim: >-
    Many columns usually mean content is split into small values instead of
    default-content semantics. For real tabular data, small amounts shown on
    one page can use the Block Collection `table` block; large or reused data
    belongs in a spreadsheet (published as JSON) that a block links to, rather
