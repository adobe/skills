- id: da-auth-ims-org-context
  claim: >-
    A fresh IMS token can authenticate the same Adobe-email account yet
    return DA 403 when issued under an IMS org other than the one supplying
    the user's DA group permissions. In the verified case the intended org
    and group were absent from the wrong-org token's IMS organizations
    response; selecting the intended org restored DA access. Check IMS org,
    account and path/action permissions before assuming a new DA grant is
    needed. The IMS org is distinct from the DA URL's org/repo path. Not
    every 403 is an org mismatch, and a missing chooser is not required for
    this failure.
  question: >-
    A fresh IMS token successfully authenticates an Adobe-email account,
    but DA returns 403 even though that account has a group-based DA grant.
    What org/context issue should you investigate before requesting new
    permissions, and is the IMS org the same thing as the DA URL's org?
  source: "User-assisted live checks summarized in https://github.com/adobe/skills/pull/560: same account/target, authorized org 200 -> other org 403 -> authorized org 200; IMS profile 200 throughout, target org/group absent in denied context"
  used_by:
    - skills/da-auth/SKILL.md

- id: da-auth-org-recovery
  claim: >-
    For a da-auth-helper token issued under the wrong IMS org, invalidate
    ~/.aem/da-token.json (helper logout), obtain a fresh token (helper token),
    select the intended org and verify the same target API request. A valid
    cached token is reused by both login and token, even if DA rejects it.
    Two procedures restored access in live tests: completing the helper's
    authorize URL in a private browser with the intended org; or switching
    to that org in da.live, then clearing the helper cache and retrying
    authentication. Switching da.live alone did not refresh the helper
    credential and left DA returning 403. For private login, keep the
    helper callback listener running and leave its automatically opened
    normal-browser flow unfinished; there is no helper incognito flag.
    These procedures worked in this setup, not proof either is necessary
    or always forces a chooser. Helper recovery does not clear CLI caches.
  question: >-
    How do you recover from a locally unexpired da-auth-helper token issued
    under the wrong IMS org? Explain the cache steps, private-browser and
    da.live org-switch alternatives, whether switching da.live alone
    refreshes the helper credential, and whether either browser procedure
    is always necessary to show an org chooser.
  source: "User-assisted live checks summarized in https://github.com/adobe/skills/pull/560: each procedure restored the same target from 403 to 200; da.live-switch-only control stayed 403. https://github.com/adobe-rnd/da-auth-helper/blob/1333f443d925a0240909424224aafd75c260e9d2/src/auth.js; src/cli.js"
  used_by:
    - skills/da-auth/SKILL.md

