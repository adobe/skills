- id: da-content-sections-required
  claim: >-
    Every piece of page content must be inside a section div that is a direct
    child of main. Elements placed directly in main (h1, p, ...) are dropped
    silently, with no error. A div placed directly in main is itself taken
    as a section, so a block div there is not a block: its rows become
    default content (a div.metadata outside a section yields no Metadata
    block and no <meta> tags). Blocks, metadata and default content all
    belong inside the section div.
  question: >-
    You emit <main><h1>Title</h1><p>Intro</p><div class="metadata">…</div></main>
    with nothing wrapping them in section divs. What survives preview, and
    what is the correct structure?
  source: "Live check 2026-11-06, shsteimer/da-playground /drafts/dc-nosec (direct children dropped), dc-pm (metadata as a section), dc-pmb (works inside a section)"
  used_by: []

- id: da-content-metadata-head-output
  claim: >-
    Page metadata rows become head tags: title -> <title>; description ->
    meta description + og:description + twitter:description; og:title also
    sets twitter:title; image -> og:image, twitter:image (absolute site URL
    with ?width=1200); tags -> one article:tag per comma value; other keys
    -> <meta name> with the key lowercased and spaces replaced by hyphens
    ("my custom" -> my-custom); a link value delivers as its text; canonical,
    og:url and twitter:card are added automatically.
  question: >-
    Which head tags does the EDS pipeline generate from a page metadata block
    with title, description, image, tags and a custom key "my custom"? Do you
    need to author og:* or twitter:* rows yourself?
  source: "Live check 2026-11-06, /drafts/dc-pmb full page head"
  used_by: []

- id: da-content-picture-generated
  claim: >-
