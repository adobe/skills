- id: da-content-main-required
  claim: >-
    DA HTML needs <main> around the section divs. <main> alone or
    <body><main> previews fine; section divs without <main> preview empty.
    <body>, <header> and <footer> are optional, and text inside header or
    footer is dropped. A full HTML document is accepted: its <title> becomes
    the title metadata and <style> is dropped.
  question: >-
    You generate DA page HTML as bare <div> sections with no <main>, or with
    content in <header> and <footer>. What reaches the preview? Which
    wrappers are required?
  source: "Live check 2026-11-06, /drafts/dc-hf1..hf5 (preview .md); @adobe/helix-html2md as run by aem-cli 16.22.16: <main> alone, <body><main> and a full body all convert, no <main> returns empty ('contains no <main>'). aem up serves ./content/ through the same html2md, so local pages behave the same."
  used_by: []

- id: use-project-test-tooling
  claim: >-
    Test with the project's own runner and E2E tool (package.json scripts,
    existing test files). Don't add a second framework. aem-boilerplate ships
    no test runner; a project that has none needs a decision, not a default.
  question: >-
    An EDS project already runs unit tests with node:test and E2E with
    Playwright. You need to add tests for a block. Which tools do you use?
    What if the project has no test setup at all?
