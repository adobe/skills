- id: cm-default-content-first
  claim: >-
    Headings, paragraphs, images, lists and links stay default content. A
    `Text`, `Heading` or `Image` block is an anti-pattern. A block is justified
    only when content needs structure (repeating items, interaction, layout),
    and variants or blocks that can be inferred from the content should be.
  question: >-
    On an EDS site, a design shows an intro section: a small label, an H2, two paragraphs and
    one centered image below them. What do authors create on the page?
