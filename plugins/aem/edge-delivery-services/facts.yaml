- id: da-content-icon-colon
  claim: >-
    In DA HTML an icon is written as :name: text. The preview pipeline
    converts any :[a-z0-9-]+: into <span class="icon icon-name"></span> in
    default content and block cells and eats the whitespace around it
    (":rocket: text" becomes "<span></span>text"). ":+1:" is not matched.
    An authored <span class="icon icon-name"></span> sent by direct PUT also
    previews as an icon, but a stored page that went through the DA editor
    lost the empty span (observed on a page the user opened and previewed
    from the editor), so only :name: is reliable for content authors edit.
  question: >-
    You generate HTML for DA. How should you write an icon so it survives
    preview and later editing in the DA editor, and what does the pipeline
    do with it?
  source: "Live check 2026-11-06, shsteimer/da-playground /drafts/dc-icon-a (:rocket: works), dc-ic (span via direct PUT previews as :name:), dc-icon-b (stored source had no span after editor open; cause unconfirmed)"
  used_by: []

