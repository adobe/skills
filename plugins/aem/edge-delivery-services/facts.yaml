- id: find-test-content-query-index
  claim: >-
    EDS sites that configure a query index expose indexed pages at
    `/query-index.json` (`{ total, offset, limit, data: [{ path, ... }] }`;
    `?limit=` and `?offset=` paginate). The server HTML of a page keeps the
    authored block classes before client-side decoration
    (`<div class="cards alternate">`), so block variants can be read from a
    plain `curl` of the page, without a browser. An index lists only the pages
    its index config includes, and a site can have other index files besides
    `/query-index.json`.
  question: >-
    On a live EDS site you need every page that uses the `cards` block and the
    variants those pages use, without opening each page in a browser. Where do
    you get the list of pages, and what in the fetched markup tells you the
    variant?
  source: "live check 2026-11 of main--helix-website--adobe.aem.live (query-index.json 189 rows, a second index file with 141 rows, server HTML div classes)"
  used_by:
    - skills/find-test-content/SKILL.md

- id: find-test-content-no-index-sitemap
  claim: >-
    Sites without a query index (the aem-boilerplate and Block Collection
    `.aem.live` hosts return 404 for `/query-index.json`) still serve
    `/sitemap.xml` when a sitemap is configured; its `<loc>` entries are a page
    list, and each page's HTML can then be searched for the block class.
  question: >-
    You want existing pages that use the `quote` block on
    `main--aem-block-collection--adobe.aem.live`, and `/query-index.json`
    returns 404. How else can you get a list of the site's pages?
  source: "live check 2026-11 (main--aem-boilerplate--adobe and main--aem-block-collection--adobe: query-index.json 404, sitemap.xml 200)"
  used_by:
    - skills/find-test-content/SKILL.md

- id: find-test-content-local-vs-proxied-index
  claim: >-
    `aem up` serves local files from `./content/` before proxying to the remote
    origin, but does not auto-generate `/query-index.json` from `./content/*.html`:
    unless `content/query-index.json` exists locally, `/query-index.json` on
    `localhost` is proxied from the remote origin. Conversely, any stale local
    file left in `./content/<path>.html` shadows newer content published or
    previewed at `<path>` on `.aem.page`/`.aem.live` when viewing through
    `aem up`. Therefore, an index-based search only discovers remotely
    indexed pages (or a local `content/query-index.json`), unindexed local
    test pages in `./content/` are found on disk, and stale `./content/` files
    must be moved or deleted (`aem content merge` does not refresh unchanged files) to see remote changes
    locally.
  question: >-
    You want to find all test pages for an existing `accordion` block on a
    running local dev server (`aem up`), and you also just previewed an updated
    page at `/about` on `.aem.page` to test it locally, but `localhost/about`
    still shows the old content. What might a search based on `/query-index.json` miss
    locally, and why is `/about` stale on `localhost`?
  source: "@adobe/aem-cli@16.22.16 src/server/HelixServer.js (handleProxyModeRequest checks CONTENT_DIR first, then proxies missing paths including /query-index.json)"
  used_by:
    - skills/find-test-content/SKILL.md
    - skills/aem-cli/SKILL.md

