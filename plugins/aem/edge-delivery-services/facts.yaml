- id: da-auth-helper-cache
  claim: >-
    adobe-rnd/da-auth-helper stores access_token and expires_at in
    ~/.aem/da-token.json. This is a user-level helper cache, distinct from
    the AEM CLI's project-level .hlx/.da-token.json cache. The helper's
    token command returns a valid cached token or starts browser login.
  question: >-
    Where does adobe-rnd/da-auth-helper cache its DA token, what fields does
    it store, and what happens when you run its token command again?
  source: "https://github.com/adobe-rnd/da-auth-helper/blob/1333f443d925a0240909424224aafd75c260e9d2/src/auth.js (TOKEN_FILE, storeToken, getValidToken); src/cli.js"
  used_by:
    - skills/da-auth/SKILL.md

- id: da-auth-cache-expiry
  claim: >-
    The helper and AEM CLI caches use expires_at as an epoch timestamp in
    milliseconds, computed from the IMS response's expires_in in seconds.
    Treat the cache as expired 60 seconds early; missing expires_at is
    treated as expired. Do not assume a fixed one-hour or 24-hour lifetime.
    A fresh timestamp is a local reuse check, not proof of server acceptance.
  question: >-
    How should a script decide whether a cached DA IMS token from the helper
    or AEM CLI is reusable? Include timestamp units, buffer, missing expiry,
    and whether you can assume all tokens last one hour.
  source: "https://github.com/adobe-rnd/da-auth-helper/blob/1333f443d925a0240909424224aafd75c260e9d2/src/auth.js (isTokenExpired, login); @adobe/aem-cli@16.22.16 src/content/da-auth.js"
  used_by:
    - skills/da-auth/SKILL.md

- id: da-auth-login-reuses-cache
  claim: >-
    da-auth-helper login and da-auth-helper token both call getValidToken;
    neither forces refresh of a locally unexpired token. After a server
    rejects such a token, repeating login can return the same rejected
    credential. The helper's logout clears its own cache; it does not clear
    the AEM CLI cache or the browser's IMS session. Real cache deletion
    requires operator approval.
  question: >-
    DA rejected a token with 401, but ~/.aem/da-token.json has a future
    expires_at. Does da-auth-helper login force a fresh token? What does
    logout clear, and what other state is independent?
  source: "https://github.com/adobe-rnd/da-auth-helper/blob/1333f443d925a0240909424224aafd75c260e9d2/src/cli.js (login/token/logout cases); src/auth.js (getValidToken, clearStoredToken); operator deletion policy"
  used_by:
    - skills/da-auth/SKILL.md

- id: da-auth-http-status
  claim: >-
    DA admin returns 401 for an anonymous identity: absent, invalid or
    expired token, or failure to resolve the IMS user can cause it. A 403
    is permission denial for the authenticated request's current identity
    and context, not proof that the token expired. Diagnose before retrying;
    do not blindly loop login or assume a new grant is required.
  question: >-
    A direct admin.da.live request returns 401 or 403. What distinction
    should guide recovery, and is an expired token the only cause of 401?
  source: "https://github.com/adobe/da-admin/blob/72939616bbee62dc8534c35c2ab210310de47755/src/index.js (anonymous/authorized gates); src/utils/auth.js (getUsers, setUser)"
  used_by:
    - skills/da-auth/SKILL.md

- id: da-auth-list-not-write
  claim: >-
    HTTP 200 from admin.da.live/list proves that listing request succeeded,
    not that the token can write every path in the repository. DA checks
    read/write permissions by path/action; a source write can return 403
    after a successful list. Do not change ACLs without approval.
  question: >-
    Listing a DA repository succeeds with 200, but uploading a page under
    /drafts returns 403 using the same token. Does the successful list
    establish write permission? What should be checked next?
  source: "https://github.com/adobe/da-admin/blob/72939616bbee62dc8534c35c2ab210310de47755/src/routes/list.js; src/routes/source.js; operator remote-write policy"
  used_by:
    - skills/da-auth/SKILL.md

- id: da-auth-cli-owned
  claim: >-
    @adobe/aem-cli@16.22.16 content commands manage their own DA login:
    supplied --token override, then valid project cache, then browser login.
    They cache in .hlx/.da-token.json for the default DA environment and
    .hlx/.da-token-<label>.json for others. A separate da-auth-helper login
    or manual token extraction is unnecessary for a normal CLI clone/push
    workflow. Do not substitute the helper cache for another environment.
  question: >-
    You want to clone DA pages and later push local edits with the AEM CLI.
    Must you obtain a DA token separately first? Where does the CLI store
    its login, including non-default DA environments?
  source: "@adobe/aem-cli@16.22.16 src/content/da-auth.js (resolveDaTokenFile, getValidToken); src/content/clone.cmd.js, push.cmd.js"
  used_by: []

- id: da-auth-mcp-specific
  claim: >-
    Do not assume all DA MCP servers expose an authentication tool or
    require returning a raw token to the assistant. adobe-rnd/da-mcp at
    bd5a2ed5 registers content tools, accepts caller Bearer auth or
    DA_ADMIN_API_TOKEN, and documents router-managed IMS for its public
    AEM API router deployment. Inspect the actual server's tools and auth
    configuration; an authenticated content tool needs no separate login.
  question: >-
    A DA MCP server is available. Can you assume it has a login tool that
    returns an IMS token? How should you decide whether separate DA auth
    is needed, and does adobe-rnd/da-mcp always require a manually passed token?
  source: "https://github.com/adobe-rnd/da-mcp/blob/bd5a2ed5d5dc24fff2ff36bd0a01f1a7c93b5ed9/src/mcp/server.ts; src/index.ts; README.md (Authentication)"
