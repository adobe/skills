  source: "https://github.com/adobe/helix-api-service/blob/473dd365ec20bdc5c0de2c4035b2bbae7ad0596b/docs/openapi/status-api.yaml (security); docs/openapi/source-api.yaml; docs/openapi/api-service.yaml (paths); src/auth/support.js (getAuthInfo)"
  used_by:
    - skills/da-auth/SKILL.md

- id: da-auth-source-store-selection
  claim: >-
    Source Bus content is addressed through
