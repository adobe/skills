- id: lv-safe-rerun
  claim: >-
    After structural edits (adding or moving a block) layout view replaces the
    page body and runs `loadPage()` again, so block code and `scripts.js` run
    again on fresh DOM while global listeners, timers and module-level state
    from the previous run remain. aem.live's layout-view guide says to scope
    state to the block, tie listeners to an AbortController and clean up when
    `block.isConnected` is false, and guard anything in loadEager/loadLazy
    that adds listeners or elements to `document`, `window` or `head`.
  question: >-
    A carousel block starts `setInterval` and a `window` resize listener in
    decorate() and keeps an `initialized` flag at module level. After authors
    add or move blocks in Experience Workspace layout view, the page shows
