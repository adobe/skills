- id: cm-block-options
  claim: >-
    Authors choose a variant in the block's header cell in parentheses:
    `Columns (dark, wide)` adds classes `columns dark wide`; a multi-word
    option is hyphenated (`super wide` becomes `super-wide`). Prefer this to a
    `style | dark` config row.
