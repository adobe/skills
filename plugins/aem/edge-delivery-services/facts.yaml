- id: da-auth-source-bus-ims
  claim: >-
    da-auth-helper obtains an IMS access token, not a credential restricted
    to DA. The api.aem.live implementation accepts IMS Bearer access tokens,
    verifies signature/type/expiry, and requires aem.frontend.all or
    aem.backend.all (with a cm-repo-service special case). The helper
    requests aem.frontend.all. A cached token can therefore be reused for
    eligible Source Bus / Experience Workspace API requests, subject to
    server acceptance and org/site/action authorization; DA success does
    not prove Source Bus access. The local variable can remain DA_TOKEN.
    PR505/issue504 report that reuse succeeded on one site; not repeated
    in this loop. Do not create a separate API key by default.
  question: >-
    An Experience Workspace site uses api.aem.live's Source Bus. You already
    have an IMS access token from da-auth-helper. Is that necessarily a
    DA-only token, or can it authenticate these API calls? What conditions
    still need checking, and must you obtain a separate API key?
  source: "https://github.com/adobe/helix-api-service/blob/473dd365ec20bdc5c0de2c4035b2bbae7ad0596b/src/auth/support.js (decodeImsToken, getAuthInfo); helper src/auth.js at 1333f443d925a0240909424224aafd75c260e9d2 (SCOPE); https://github.com/adobe/skills/issues/504 (prior single-site report)"
  used_by:
    - skills/da-auth/SKILL.md

- id: da-auth-source-bus-verification
  claim: >-
    Authenticate/verify against the API the caller needs: DA admin and
    api.aem.live are not interchangeable acceptance tests. A 200 from
    GET https://api.aem.live/<org>/sites/<site>/status/ alone does not prove
    authentication: the OpenAPI status operation allows unauthenticated
    access. Check authenticated identity/permissions or an operation known
    to require the intended access, without exposing the credential or
    performing writes just to test auth. Source routes are under
    /<org>/sites/<site>/source/. In this implementation an auth_token
    cookie takes precedence over Authorization, so ensure a Bearer-token
    check is not actually succeeding under a different cookie identity.
  question: >-
    A request to api.aem.live/<org>/sites/<site>/status/ returns 200 with an
    IMS Bearer header. Does this prove that token can access Source Bus
    content? How would you verify the intended credential and access
    without uploading or publishing anything?
  source: "https://github.com/adobe/helix-api-service/blob/473dd365ec20bdc5c0de2c4035b2bbae7ad0596b/docs/openapi/status-api.yaml (security); docs/openapi/source-api.yaml; docs/openapi/api-service.yaml (paths); src/auth/support.js (getAuthInfo)"
  used_by:
    - skills/da-auth/SKILL.md

- id: da-auth-source-store-selection
  claim: >-
    Source Bus content is addressed through
    api.aem.live/<org>/sites/<site>/source/; DA content through
    admin.da.live/source/<org>/<repo>/ and admin.da.live/list/<org>/<repo>/.
    A non-empty DA listing alone does not establish the site's active
    authoring source: issue504 reports onboarding index/nav/footer in DA
    while the authored content lived in Source Bus. Use the site's known
    authoring setup/configuration and user confirmation; inspect both
    stores read-only where authorized rather than choosing by which has
    documents. Writing to an unused store need not update the served page.
    Full content-writing/format guidance belongs to the content workflow,
    not a requirement to obtain another token.
  question: >-
    A site is authored in Experience Workspace, but a DA listing contains
    index, nav and footer. Does that prove DA is the content store to write
    to? Which API families should you distinguish and how should you
    resolve the intended store before writing?
  source: "https://github.com/adobe/skills/issues/504 (prior mixed-store observation); https://github.com/adobe/helix-api-service/blob/473dd365ec20bdc5c0de2c4035b2bbae7ad0596b/docs/openapi/api-service.yaml (source paths); DA admin route API"
  used_by:
    - skills/da-auth/SKILL.md
