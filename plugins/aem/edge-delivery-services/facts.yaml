    the folder first, including any local pages in it.
  question: >-
    You already have local test pages in `./content/` and now run
    `aem content clone --path /drafts`. What happens to them?
  source: "@adobe/aem-cli 16.22.16 src/content/clone.cmd.js"
  used_by:
    - skills/aem-cli/SKILL.md
    - evals/aem-cli-local-test-content

- id: aem-cli-no-stop-other
  claim: >-
    `aem up --no-stop-other` leaves a server already on the port running and
    exits with `Port N already in use by another process.` instead of
    stopping it; then reuse that server if it is this checkout's, or start on
    another port with `--port`.
  question: >-
    How do you start `aem up` so it can never stop a dev server another
    checkout already runs on the same port, and what happens if the port is
    taken?
  source: "@adobe/aem-cli 16.22.16 src/up.js (stop-other), src/server/BaseServer.js; checked live"
  used_by:
    - skills/aem-cli/SKILL.md
    - evals/aem-cli-worktree-port
