    if the site is protected.
  question: >-
    You need to see how the pipeline interpreted a DA page that you just
    previewed, but aem.page returns 401. How do you inspect the result?
  source: "Live check 2026-11-06, shsteimer/da-playground /drafts/dc-* via admin.hlx.page"
  used_by:
    - skills/da-content/SKILL.md

- id: da-content-main-required
  claim: >-
    DA HTML needs <main> around the section divs. <main> alone or
    <body><main> previews fine; section divs without <main> preview empty.
    <body>, <header> and <footer> are optional, and text inside header or
    footer is dropped. A full HTML document is accepted: its <title> becomes
    the title metadata and <style> is dropped.
  question: >-
    You generate DA page HTML as bare <div> sections with no <main>, or with
    content in <header> and <footer>. What reaches the preview? Which
    wrappers are required?
  source: "Live check 2026-11-06, /drafts/dc-hf1..hf5 (preview .md); @adobe/helix-html2md as run by aem-cli 16.22.16: <main> alone, <body><main> and a full body all convert, no <main> returns empty ('contains no <main>'). aem up serves ./content/ through the same html2md, so local pages behave the same."
  used_by:
    - skills/da-content/SKILL.md
    - evals/da-content-page-html-traps

- id: cm-no-nested-blocks
  claim: >-
    aem.live's markup guide says blocks should never be nested (a table
    inside a block's cell) because it makes them very hard to use for
    authors; David's Model (Rule 2) suggests fragments or links with auto
    blocking instead.
  question: >-
    In an AEM Edge Delivery Services (EDS) site, a tabs block needs a cards grid
    inside each tab. How do authors create that in Word or Google Docs?
  source: >-
    https://www.aem.live/docs/davidsmodel (Rule 2);
    https://www.aem.live/developer/markup-sections-blocks ("Blocks should never be nested")
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-default-content-first
  claim: >-
    aem.live's markup guide says to leave as much content as possible as
    default content (headings, paragraphs, images, lists, links). David's
    Model (Rule 1) calls a `Text`, `Heading` or `Image` block an anti-pattern
    and says variants or blocks that can be inferred from the content should
    be.
  question: >-
    On an EDS site, a design shows an intro section: a small label, an H2, two paragraphs and
    one centered image below them. What do authors create on the page?
  source: >-
    https://www.aem.live/docs/davidsmodel (Rule 1);
    https://www.aem.live/developer/markup-sections-blocks (Default Content)
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-key-value-config-only
  claim: >-
    David's Model (Rule 14) says name/value rows are for configuration that is
    not displayed (like section metadata, which becomes `data-` attributes),
    and does not recommend name/value pairs for displayed content such as a
    heading, image or text.
  question: >-
    On an EDS site, a pricing block shows, per tier, a name, a price, a feature list and a
    button. A developer proposes a two-column table with a label in the left
    cell and the value in the right. Do you accept that model?
  source: https://www.aem.live/docs/davidsmodel (Rule 14)
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-tabular-data-spreadsheet
  claim: >-
    David's Model (Rule 10) says many columns usually mean content is split
    into small values instead of default-content semantics, and that real
    tabular data is often better provided via a spreadsheet. The Block
    Collection has a `table` block.
  question: >-
    On an EDS site, a comparison block shows 8 features across 5 plans (a 9 by 6 grid of
    ticks and short values). How do authors provide that data?
  source: https://www.aem.live/docs/davidsmodel (Rule 10); Block Collection `table` block
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-semantic-cells
  claim: >-
    A block cell holds default content (heading, paragraphs, links, picture).
    David's Model (Rule 10) says many columns are usually a symptom of content
    split into small values that do not use default-content semantics.
  question: >-
    In an EDS block's authored table, what can a single cell hold, and what does
    a block table with many columns usually indicate?
  source: https://www.aem.live/docs/davidsmodel (Rule 10); https://www.aem.live/developer/markup-sections-blocks
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-block-options
  claim: >-
    Authors choose a variant in the block's header cell in parentheses:
    `Columns (dark, wide)` adds classes `columns dark wide`; a multi-word
    option is hyphenated (`super wide` becomes `super-wide`).
  question: >-
    One EDS quote block must come in a dark look and a wide look, chosen per
    instance by the author. How does the author choose, and what does the
    block element carry?
  source: https://www.aem.live/developer/markup-sections-blocks (Block Options)
  used_by:
    - skills/da-content/SKILL.md
    - skills/aem-block-library/SKILL.md

- id: cm-simple-link-lists
  claim: >-
    David's Model (Rule 5) says a simple list of links may be easiest as all
    the links in one cell, with code pulling every link from the block, and
    that complex list items are easier as one row each.
  question: >-
    An EDS related-articles block shows 6 links to other pages. How do authors
    enter them, and what must the block accept?
  source: https://www.aem.live/docs/davidsmodel (Rule 5)
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-fragments-cost
  claim: >-
    David's Model (Rule 12) says fragments suit identical content reused on
    many pages (header, footer, sign-up form, legal text), that authors then
    see only a reference (worse with nested fragments), and that
    SEO-relevant content should stay on the page.
  question: >-
    An EDS product page repeats a legal disclaimer used on 200 pages and also has a
    long intro text that matters for search. Where would you use fragments?
  source: https://www.aem.live/docs/davidsmodel (Rule 12)
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-no-alt-text-config
  claim: >-
    David's Model (Rule 13) recommends extra information in image alt text
    only in exceptional cases: authors cannot easily see it, and copy/paste
    can drop it silently.
  question: >-
    Each image in an EDS gallery block needs an optional "featured" flag. Where in
    the content model does the author set it?
  source: https://www.aem.live/docs/davidsmodel (Rule 13)
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-auto-block-links
  claim: >-
    A link alone in its paragraph can be auto-blocked into a block (e.g.
    YouTube `embed`, fragment, modal) in `buildAutoBlocks()` of `scripts.js`,
    so authors paste a URL and create no table.
  question: >-
    On an EDS site, authors should add a YouTube video to a page without building a table.
    What makes that work?
  source: https://www.aem.live/developer/markup-sections-blocks (Auto Blocking)
  used_by:
    - skills/content-modeling/SKILL.md

- id: cm-widgets-not-blocks
  claim: >-
    aem.live's widgets guide treats application-like parts (forms, search,
    filters, calculators, dealer locators) as widgets, not blocks: a
    `/widgets/<name>/` folder with .html,
    .css and .js, and authors paste the widget's .html URL alone in a
    paragraph, which renders a `widget` block. Query-string parameters become
    `data-` attributes. No table to author.
  question: >-
    An EDS site needs a contact form and a mortgage calculator, each on one or two
    pages. What do authors put in the document, and where does the code live?
  source: https://www.aem.live/docs/widgets; aem-boilerplate 5cea543 blocks/widget
  used_by:
    - skills/content-modeling/SKILL.md

# ue-component-model facts, checked against aem.live docs and aem-boilerplate-xwalk 6210531 (2026-11-12).

# ue-component-model facts, checked against aem.live docs and aem-boilerplate-xwalk 6210531 (2026-11-12).

- id: ue-block-table-mapping
  claim: >-
    In AEM authoring with the Universal Editor, a simple block renders each
    model property (or group) as one row with a single column, in model order.
    A container block renders its own properties as single-column rows first,
    then each child item as a row with one column per property.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, a hero
    block's model lists image, imageAlt and text, in that order. What block
    markup reaches the browser?
  source: https://www.aem.live/developer/component-model-definitions (Block structure)
  used_by:
    - skills/ue-component-model/SKILL.md

- id: ue-field-collapse
  claim: >-
    Properties ending in the case-sensitive suffixes `Title`, `Type`,
    `MimeType`, `Alt` or `Text` are not values but attributes of the property
    they follow: `image` + `imageAlt` becomes one `<picture><img alt>`, `link` +
    `linkText` + `linkTitle` + `linkType` one `<a>` (type primary or secondary
    wraps it in strong or em), `heading` + `headingType` one heading.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, a block model has fields `cta`, `ctaText` and `ctaType` (value
    `primary`). What does the block's cell contain after rendering?
  source: https://www.aem.live/developer/component-model-definitions (Field collapse)
  used_by:
    - skills/ue-component-model/SKILL.md

- id: ue-element-grouping
  claim: >-
    Fields named `<group>_<field>` (underscore) are concatenated into a single
    cell, so an author gets separate fields (subtitle, title, description,
    buttons) while the block gets one cell of semantic elements.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, a teaser model needs a subtitle, title, description and two buttons that
    must end up as one text cell of semantic markup. How do you name the
    fields?
  source: https://www.aem.live/developer/component-model-definitions (Element grouping)
  used_by:
    - skills/ue-component-model/SKILL.md

- id: ue-classes-block-options
  claim: >-
    A `classes` property becomes the block options in the table header (class
    names on the block). `classes_<name>` fields extend it; a boolean `classes_`
    field adds its name as an option when true.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, how do you let authors pick a background color and toggle a
    full-width option so both end up as classes on the block element?
  source: https://www.aem.live/developer/component-model-definitions (Type inference; Element Grouping for Block Options)
  used_by:
    - skills/ue-component-model/SKILL.md

- id: ue-nesting-sections
  claim: >-
    The content model allows one level of nesting: a section contains default
    content or blocks. A component that contains other components (tabs,
    accordion) is modelled as sections (resource type
    `core/franklin/components/section/v1/section`, e.g. a `tab` definition)
    that client-side auto-blocking combines.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, tabs must each hold a cards block. How do you define this
    in the component definitions?
  source: https://www.aem.live/developer/component-model-definitions (end of Blocks section)
  used_by:
    - skills/ue-component-model/SKILL.md
    - evals/ue-component-model-tabs-cards

- id: ue-multifield-flag
  claim: >-
    Multi-field rendering (`multi: true` fields) is off by default. Enable it
    with `public.xwalk.multi-field.enabled: true` in the Admin Configuration
    API site config or in `xwalk.json` at the repo root. Otherwise multi values
    render as one comma-separated list.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, a block model has a `reference` field with `multi: true` for images, but
    the block receives one comma-separated string. Why, and how do you fix it?
  source: https://www.aem.live/developer/component-model-definitions (Multi-Fields)
  used_by:
    - skills/ue-component-model/SKILL.md
    - evals/ue-component-model-promo-banner

- id: ue-block-resource-type
  claim: >-
    Every block uses resource type `core/franklin/components/block/v1/block`
    and a template `name`; if either is missing the block does not render.
    aem.live's component model guide says custom AEM components are not
    necessary or recommended: the markup is a fixed contract.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, a block was added to component-definition.json and shows in the UE palette,
    but renders nothing on the page. What do you check first?
  source: https://www.aem.live/developer/component-model-definitions (Block model definition)
  used_by:
    - skills/ue-component-model/SKILL.md

- id: ue-columns-no-model
  claim: >-
    The columns block has no content modeling in UE: it only has `rows`,
    `columns` and `classes` properties, and authors add only default content to
    its cells.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, can a model give a columns block a dedicated field for each column's
    content?
  source: https://www.aem.live/developer/component-model-definitions (Columns Block)
  used_by:
    - skills/ue-component-model/SKILL.md

- id: ue-key-value-use
  claim: >-
    `"key-value": true` renders the block's properties as `name | value` rows.
    aem.live's component model guide uses it for blocks read as configuration
    (section metadata, spreadsheet-driven lists) and recommends decorating
    the rendered semantic markup in most other cases.
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor, when would you set `key-value` to true in a block's
    template, and when not?
  source: https://www.aem.live/developer/component-model-definitions (Key-value block)
  used_by:
    - skills/ue-component-model/SKILL.md

- id: ue-aggregate-json-generated
  claim: >-
    In aem-boilerplate-xwalk a block's component definitions, models and
    filters live in `blocks/<name>/_<name>.json` (and `models/_*.json`). The
    root component-definition.json, component-models.json and
    component-filters.json are generated from them with `npm run build:json`
    (the pre-commit hook runs it when a partial is staged).
  question: >-
    In an AEM Edge Delivery project authored with the Universal Editor (the
    aem-boilerplate-xwalk setup), you edit component-models.json at the root
    for a block that has `blocks/hero/_hero.json`, and the edit disappears
    after a commit. Why, and where do you make the change?
  source: aem-boilerplate-xwalk 6210531 package.json (build:json) and .husky/pre-commit.mjs
  used_by:
    - skills/ue-component-model/SKILL.md

- id: content-source-config
  claim: >-
    A site's content store is `content.source` in its site config, read with
    `GET https://admin.hlx.page/config/{org}/sites/{site}.json` or
    `GET https://api.aem.live/{org}/sites/{site}/config.json` (IMS token).
    `type: markup` with `url: https://content.da.live/{org}/{site}/` is DA;
    `type: sourcebus` (optional `url: https://api.aem.live/{org}/sites/{site}/source`)
    is Source Bus. `fstab.yaml` is deprecated.
  question: >-
    A user asks you to add a page to their existing Edge Delivery site. How do
    you find out which system stores the site's authored content?
  source: >-
    https://www.aem.live/docs/api.html (schemas content, content-source-sourcebus);
    https://www.aem.live/docs/config-service-setup
  used_by:
    - skills/create-site/SKILL.md

- id: sourcebus-source-api
  claim: >-
    On Source Bus the content API is
    `https://api.aem.live/{org}/sites/{site}/source/{path}`. `PUT` creates or
    replaces a document and takes the raw body with a `Content-Type` header
    (`text/html`), not DA's multipart form. It rejects external images with
    400; `POST` interns the images. A trailing slash lists a folder.
  question: >-
    You have a valid IMS token and want to create `/nav.html` for a site whose
    content is stored in Source Bus. What request do you send, and what changes
    when the page contains images hosted elsewhere?
  source: >-
    https://www.aem.live/docs/api.html (putSourceDocument, createSourceDocument)
  used_by:
    - skills/da-content/SKILL.md
    - skills/create-site/SKILL.md

- id: sourcebus-preview-publish
  claim: >-
    On Source Bus, preview and publish are
    `POST https://api.aem.live/{org}/sites/{site}/preview/{path}` and
    `.../live/{path}`, with no `main` ref segment (the legacy call is
    `POST admin.hlx.page/preview/{org}/{repo}/main/{path}`). Status:
    `GET https://api.aem.live/{org}/sites/{site}/status/{path}`. The legacy
    `POST admin.hlx.page/preview/{org}/{site}/main/{path}` returns 404 (`No
    handler found for document`) on a Source Bus site.
  question: >-
    Content for a new site is stored in Source Bus and you need it on the
    .aem.page preview. Which API call previews /nav, and how does it differ from
    the call for a site on the legacy admin API?
  source: >-
    https://www.aem.live/docs/api.html; https://www.aem.live/docs/ew/developing/structured-content-api
    ("admin.hlx.page for DA, or api.aem.live for helix6")
  used_by:
    - skills/da-content/SKILL.md
    - skills/create-site/SKILL.md

- id: ping-site-exists
  claim: >-
    `GET https://admin.hlx.page/ping/{org}/{site}` needs no credentials: 200
    (empty body) when the site config exists, 404 (`config for site not found`)
    when it does not. `/status/...` returns 401 without credentials.
  question: >-
    A user installed the AEM Code Sync GitHub app on a new repo. How can a script
    confirm, without any credentials, that Edge Delivery now knows the site?
  source: live probe 2026-11-14 (adobe/aem-boilerplate 200, nosuchorg/x 404, status 401)
  used_by:
    - skills/create-site/SKILL.md

- id: content-source-change-resets
  claim: >-
    Changing `content` of an existing site gives a new Content Bus ID: all
    previously previewed and published content must be previewed and published
    again, and index and sitemap config recreated. aem.live's config service
    guide recommends, for production, creating a new site with the new
    content config and switching the CDN origin.
  question: >-
    A site's content was previewed and published from one content store. You
    update the site config to point at a different store. What happens to the
    live pages, and what must you redo?
  source: https://www.aem.live/docs/config-service-setup (Update Content Location)
  used_by:
    - skills/create-site/SKILL.md

- id: sourcebus-site-setup
  claim: >-
    A new site can use Source Bus by choosing it in the AEM Code Sync setup
    wizard on tools.aem.live, or by changing `content.source` in the site config
    to `type: sourcebus` with the config API or the site admin tool.
  question: >-
    You created a repo from aem-boilerplate and installed the Code Sync app. How
    does the site get connected to a content store, and how would you make it use
    Source Bus instead of DA?
  source: user (AEM Edge Delivery maintainer), 2026-11-14; https://www.aem.live/docs/config-service-setup
  used_by:
    - skills/create-site/SKILL.md

- id: aem-content-da-only
  claim: >-
    `aem content clone` and `aem content push` (aem-cli 16.22.18) talk to
    `admin.da.live` only (`AEM_DA_ADMIN` overrides the host). They do not read or
    write Source Bus.
  question: >-
    A site's content is stored in Source Bus (api.aem.live). Can you use
    `aem content clone` to edit it locally?
  source: aem-cli 16.22.18 src/content/da-api.js
  used_by:
    - skills/aem-cli/SKILL.md
    - skills/create-site/SKILL.md

- id: boilerplate-nav-footer-fragments
  claim: >-
    In aem-boilerplate the header block loads the `/nav` document and gives its
    first three sections the classes `nav-brand`, `nav-sections` and `nav-tools`
    (brand link, a list of links, tools); the footer block loads `/footer` and
    uses all of it. Both are plain pages (no blocks needed) that must be
    previewed before they render.
  question: >-
    You start a site from aem-boilerplate and author a nav document. What
    structure must it have for the default header to render it, and where does
    the footer come from?
  source: aem-boilerplate 5cea543, blocks/header/header.js and blocks/footer/footer.js
  used_by:
    - skills/create-site/SKILL.md

- id: site-name-limits
  claim: >-
    The host `<branch>--<site>--<org>` must not exceed 63 characters, and
    branch, repo (site) and org cannot contain `--`.
  question: >-
    What limits apply to the org, repository and branch names of an Edge
    Delivery site because of the preview URL?
  source: https://www.aem.live/developer/anatomy-of-a-project
  used_by:
    - skills/create-site/SKILL.md
- id: lv-bootstrap-requirements
  claim: >-
    Experience Workspace layout view renders the page with the site's own
    code and injects a bootstrap into the first `<script src="/scripts/scripts.js">`
    in `head.html`; `scripts.js` must define a top-level `loadPage` function
    (as the boilerplate does). A site that loads its entry script under another
    name or path, or wraps loadPage, gets no layout view.
  question: >-
    A site's head.html loads its entry script as `/scripts/main.js` and
    Experience Workspace layout view never shows the page. What does layout
    view need from the site's entry script and head.html?
  source: https://www.aem.live/docs/ew/developing/layout-view
  used_by:
    - skills/aem-layout-view/SKILL.md

- id: lv-cors-origin
  claim: >-
    Layout view renders on `https://{BRANCH}--{SITE}--{ORG}.preview.da.live`.
    Off-origin requests the site makes (APIs, fragments from other sites, fonts)
    must allow that origin in their CORS settings, or they fail in layout view
    while working on aem.page.
  question: >-
    A block fetches JSON from a separate API host and loads a font from another
    domain. Both work on the .aem.page preview but fail when authors open the
    page in Experience Workspace layout view. What do you check on those hosts?
  source: https://www.aem.live/docs/ew/developing/layout-view
  used_by:
    - skills/aem-layout-view/SKILL.md
    - evals/aem-layout-view-broken-block

- id: lv-keep-block-element
  claim: >-
    In layout view the block's outer element carries `data-block-index` and its
    first class is the block name; selection, the block label, the outline and
    moving or deleting blocks depend on both. aem.live's layout-view guide says
    decorate() may change the block's children and add classes, but must not
    replace the block element (`replaceWith`, a new wrapper) or overwrite its
    classes.
  question: >-
    An EDS block's decorate() builds a `<section class="cards">` wrapper and
    calls `block.replaceWith(wrapper)`. The published page looks right, but in
    Experience Workspace layout view authors can't select, move or delete the
    block. Why, and what is the fix?
  source: https://www.aem.live/docs/ew/developing/layout-view
  used_by:
    - skills/aem-layout-view/SKILL.md
    - evals/aem-layout-view-broken-block

- id: lv-move-dont-copy-text
  claim: >-
    Text is editable in layout view only while the original element, with its
    `data-prose-index`, is still in the page. Copying text into a new element
    (`textContent`) or unwrapping it from its `<p>` or heading looks the same to
    readers but can't be edited. aem.live's layout-view guide says to move the
    authored elements and style them with classes on a wrapper, and, if an
    element must be replaced, to copy `data-prose-index` onto the replacement.
  question: >-
    A cards block's decorate() reads each cell's `h2` text and creates a new
    `h3` with that text. It renders correctly, yet authors can't edit the card
    titles inline in Experience Workspace. Why, and how do you keep the titles
    editable?
  source: https://www.aem.live/docs/ew/developing/layout-view
  used_by:
    - skills/aem-layout-view/SKILL.md
    - evals/aem-layout-view-broken-block

- id: lv-no-decoration-in-text
  claim: >-
    When an author clicks a text element in layout view, the inline editor
    rebuilds it from the document, so icons, spans or classes that code added
    inside or on it (list items included) disappear. aem.live's layout-view
    guide says to decorate a wrapper outside the text element, or use CSS
    (`::before` on an ancestor's list items).
  question: >-
    A block prepends an icon `<span>` into each `h3` and adds a `check` class
    to every `li`. In Experience Workspace layout view, the icons and classes
    vanish as soon as an author clicks into the text. Why, and what should the
    block do instead?
  source: https://www.aem.live/docs/ew/developing/layout-view
  used_by:
    - skills/aem-layout-view/SKILL.md
    - evals/aem-layout-view-broken-block

- id: lv-no-combinators-on-text
  claim: >-
    While an author edits a text element in layout view, it is wrapped in extra
    `div` elements, so selectors that depend on its parent or siblings (`>`,
    `+`, `~`, `:first-child` on text) stop matching and the layout shifts while
    typing. aem.live's layout-view guide says to use descendant selectors
    (`.hero p`) and mark specific cells with a class from JavaScript.
  question: >-
    Block CSS uses `.hero > div > p { font-size: ... }` and `.cards h3 + p {
    margin-top: 0 }`. In Experience Workspace layout view, the spacing and font
