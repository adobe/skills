- id: find-test-content-query-index
  claim: >-
    EDS sites expose indexed pages at `/query-index.json?offset=<n>&limit=<n>`
    (`{ data: [{ path, ... }] }`). `find-test-content`'s
    `scripts/find-block-content.js <block> [host]` paginates `/query-index.json`,
    fetches each page's server HTML (where blocks already have
    `class="<block> <variant>"` before client-side decoration), and queries
    `.{block}` to report matching URLs, instance counts and variant classes.
    Its `jsdom` dependency lives in `<SKILL_DIR>/scripts/package.json`.
  question: >-
    How do you programmatically find all indexed pages on an EDS site (local
    dev or `.aem.page`/`.aem.live`) that use a given block and see which
    variants each page uses? How does the site expose its page list, and how
    are block variants represented in the fetched HTML before client-side
    decoration runs?
  source: "skills/find-test-content/scripts/find-block-content.js (fetchQueryIndex, pageContainsBlock)"
  used_by:
    - skills/find-test-content/SKILL.md

- id: find-test-content-local-vs-proxied-index
  claim: >-
    `aem up` serves local files from `./content/` before proxying to the remote
    origin, but does not auto-generate `/query-index.json` from `./content/*.html`:
    unless `content/query-index.json` exists locally, `/query-index.json` on
    `localhost` is proxied from the remote origin. Conversely, any stale local
    file left in `./content/<path>.html` shadows newer content published or
    previewed at `<path>` on `.aem.page`/`.aem.live` when viewing through
    `aem up`. Therefore, `find-block-content.js` only discovers remotely
    indexed pages (or a local `content/query-index.json`), unindexed local
    test pages in `./content/` are found on disk, and stale `./content/` files
    must be cleaned up or updated (`aem content merge`) to see remote changes
    locally.
  question: >-
    You want to find all test pages for an existing `accordion` block on a
    running local dev server (`aem up`), and you also just previewed an updated
    page at `/about` on `.aem.page` to test it locally, but `localhost/about`
    still shows the old content. What might `find-block-content.js` miss
    locally, and why is `/about` stale on `localhost`?
  source: "@adobe/aem-cli@16.22.16 src/server/HelixServer.js (handleProxyModeRequest checks CONTENT_DIR first, then proxies missing paths including /query-index.json)"
  used_by:
    - skills/find-test-content/SKILL.md
    - skills/aem-cli/SKILL.md
