<!doctype html>
<html><head><meta charset="utf-8"><title>consent pair fixture</title>
<style>
  html,body{margin:0;padding:0} body{width:800px;font-family:sans-serif}
  section{height:500px;background:#ffcc00}
  #cookie-banner{position:fixed;bottom:0;left:0;width:800px;height:120px;background:#222;color:#fff;padding:12px;box-sizing:border-box}
  #settings{display:none}
  #ot-sdk-btn-floating{position:fixed;left:8px;bottom:140px;width:48px;height:48px;border-radius:50%;background:#0a0;z-index:900}
  #survey{position:fixed;right:8px;bottom:140px;width:240px;height:120px;border:0;z-index:900}
</style></head>
<body>
<main><section><h1>Content</h1></section><section><h2>More</h2></section></main>
<div id="cookie-banner" class="cookie-banner"><p>We use cookies.</p>
  <div id="settings"><button data-testid="accept-all" onclick="document.body.dataset.consent='hidden-twin'">Accept all</button></div>
  <div class="cookie-consent-buttons"><button data-testid="accept-all" onclick="document.body.dataset.consent='visible';document.getElementById('cookie-banner').remove()">Accept all</button></div>
</div>
<button id="ot-sdk-btn-floating" aria-label="Cookie settings"></button>
<iframe id="survey" srcdoc="<style>body{margin:0;background:#fee;font-family:sans-serif}</style><p>Take our survey?</p><button onclick=&quot;document.body.dataset.closed='yes';this.remove()&quot;>No thanks</button>"></iframe>
</body></html>
