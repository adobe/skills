<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Bespoke hero</title><style>.hero{display:grid}</style></head>
<body>
  <main>
    <section class="hero" data-section="hero">
      <div class="hero-copy">
        <p class="eyebrow">Member-owned</p>
        <h1>A split hero with a picture beside the copy</h1>
        <p><a class="btn btn-primary" href="/quote">Start a quote</a></p>
      </div>
      <div class="hero-media">
        <img src="https://content.da.live/ridgeway/sdt-ridgeway/media/porch.jpg" alt="A porch at dusk">
      </div>
    </section>
    <section class="story" data-section="story">
      <div class="container">
        <h2>Plain words</h2>
        <p>Every policy is written so a new member can read it on one page.</p>
      </div>
    </section>
  </main>
</body>
</html>
